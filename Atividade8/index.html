<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exercícios JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>1) Números</h2>
    <input type="number" id="n1" placeholder="Número 1">
    <input type="number" id="n2" placeholder="Número 2">
    <input type="number" id="n3" placeholder="Número 3">
    <br>
    <button onclick="calcular()">Calcular</button>
    <div class="resultado" id="resultadoNumeros"></div>
  </div>

  <div class="container">
    <h2>2) Letras</h2>
    <input type="text" maxlength="1" class="letra">
    <input type="text" maxlength="1" class="letra">
    <input type="text" maxlength="1" class="letra">
    <input type="text" maxlength="1" class="letra">
    <input type="text" maxlength="1" class="letra">
    <br>
    <button onclick="gerarPalavras()">Gerar Palavras</button>
    <div class="resultado" id="resultadoLetras"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
