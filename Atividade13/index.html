<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformar Texto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Exercício</h1>

        <label for="texto">Digite um texto:</label>
        <input type="text" id="texto" placeholder="Digite aqui...">

        <div class="opcoes">
            <label>
                <input type="radio" name="transformacao" id="maiusculas">
                Maiúsculas
            </label>

            <label>
                <input type="radio" name="transformacao" id="minusculas">
                Minúsculas
            </label>
        </div>

        <h3>Resultado:</h3>
        <p id="resultado"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
